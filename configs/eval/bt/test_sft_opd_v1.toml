# Final test design: SFT and OPD checkpoints at four data scales plus two references
# (untrained student, Qwen3.5-397B teacher): 10 systems, 16 comparisons, cycle rank 7.
# Fixed on 2026-11-24 before any test judging; GLM was dropped as a reference.
# System files are the frozen GenerationResult outputs on the 1,000 test products.
# Comparisons list the system expected to be stronger first; win rates are reported for it.
[design]
name = "test_sft_opd_v1"
products = "data/eval/test/product_items.jsonl"
anchor = "base"
pairs = "data/eval/test/bt_pairs_test_sft_opd_v1.jsonl"
include_truncated = true

[systems]
base = "results/training/test_references_v1/generations/test/student_untrained.jsonl"
sft_1k = "results/training/sft_formal_v1/generations/test/scale_1k.jsonl"
sft_2k = "results/training/sft_formal_v1/generations/test/scale_2k.jsonl"
sft_4k = "results/training/sft_formal_v1/generations/test/scale_4k.jsonl"
sft_8k = "results/training/sft_formal_v1/generations/test/scale_8k.jsonl"
opd_1k = "results/training/opd_formal_v1/generations/test/scale_1k.jsonl"
opd_2k = "results/training/opd_formal_v1/generations/test/scale_2k.jsonl"
opd_4k = "results/training/opd_formal_v1/generations/test/scale_4k.jsonl"
opd_8k = "results/training/opd_formal_v1/generations/test/scale_8k.jsonl"
teacher_397b = "results/training/test_references_v1/generations/test/teacher_qwen397b.jsonl"

# Main result: OPD vs SFT at each scale.
[[comparisons]]
systems = ["opd_1k", "sft_1k"]
[[comparisons]]
systems = ["opd_2k", "sft_2k"]
[[comparisons]]
systems = ["opd_4k", "sft_4k"]
[[comparisons]]
systems = ["opd_8k", "sft_8k"]

# Scale chains.
[[comparisons]]
systems = ["sft_2k", "sft_1k"]
[[comparisons]]
systems = ["sft_4k", "sft_2k"]
[[comparisons]]
systems = ["sft_8k", "sft_4k"]
[[comparisons]]
systems = ["opd_2k", "opd_1k"]
[[comparisons]]
systems = ["opd_4k", "opd_2k"]
[[comparisons]]
systems = ["opd_8k", "opd_4k"]

# Starting point (also closes cycles through each chain).
[[comparisons]]
systems = ["sft_1k", "base"]
[[comparisons]]
systems = ["opd_1k", "base"]
[[comparisons]]
systems = ["sft_8k", "base"]
[[comparisons]]
systems = ["opd_8k", "base"]

# Teacher reference.
[[comparisons]]
systems = ["teacher_397b", "sft_8k"]
[[comparisons]]
systems = ["teacher_397b", "opd_8k"]
