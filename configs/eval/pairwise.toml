# Model credentials and endpoint live in configs/models.toml / environment.
[judge]
model_alias = "qwen"
protocol_version = "pairwise-v0.2"
input_mode = "ad_text_only"
# Compare with the existing human preferences without rewriting their protocol.
human_annotation_protocol_version = "pairwise-v0.1"
system_prompt = "prompts/eval/pairwise/system_v2.txt"
user_prompt = "prompts/eval/pairwise/user_v2.txt"
temperature = 0.0
max_output_tokens = 1024
timeout_seconds = 90.0
max_retries = 3
retry_delay = 2.0

# Explicitly recorded in the manifest; tune this in a new run, not in-place.
[judge.provider_options]
enable_thinking = false
