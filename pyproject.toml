[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adgenius-plus"
version = "0.1.0"
description = "Advertising copy generation, evaluation, and training experiments"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
