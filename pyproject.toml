[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adgenius-plus"
version = "0.1.0"
description = "Advertising copy generation, evaluation, and training experiments"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1.0,<2", "jsonschema>=4,<5"]

[project.optional-dependencies]
# Installed on the Colab GPU VM by scripts/opd/lr_sweep/watchdog.py (vLLM needs Linux + CUDA).
training = ["trl[vllm]==1.18.0", "transformers==5.23.0", "datasets", "accelerate", "tinker",
            "flash-linear-attention", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]
